version: '3.8'

networks:
  claq_internal:
    driver: bridge
  claq_public:
    driver: bridge

services:
  # 1. Reverse Proxy (HTTPS / SSL Termination)
  nginx:
    image: nginx:1.25-alpine
    container_name: claq_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - claq_public
      - claq_internal

  # 2. Backend API Server (Node.js / Lambda-compatible)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-runner
    container_name: claq_api
    restart: always
    environment:
      NODE_ENV: development
      PORT: 4000
      APP_ENV: demo
      DATABASE_URL: postgresql://claq_admin:${POSTGRES_PASSWORD}@db:5432/claq_fiscal_alert?schema=public&sslmode=require&connection_limit=5
      KMS_KEY_ID: ${KMS_KEY_ID:-local-dev-key}
      DOCUMENT_BUCKET: ${DOCUMENT_BUCKET:-claq-fiscal-documents}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-}
      ALERTS_FROM_EMAIL: ${ALERTS_FROM_EMAIL:-alerts@demo.claq.co.mz}
      MPESA_WEBHOOK_SECRET: ${MPESA_WEBHOOK_SECRET:-dev-secret}
      MPESA_API_HOST: ${MPESA_API_HOST:-https://api.mpesa.vm.co.mz:18352}
      MPESA_SERVICE_PROVIDER_CODE: ${MPESA_SERVICE_PROVIDER_CODE:-171717}
      WHATSAPP_SECRET_ARN: ${WHATSAPP_SECRET_ARN:-}
      DIGITAL_SEAL_SECRET: ${DIGITAL_SEAL_SECRET:-dev-seal-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000,http://localhost:5173}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - claq_internal

  # 3. PostgreSQL 16 with pgvector extension (Isolated inside private network)
  db:
    image: pgvector/pgvector:pg16
    container_name: claq_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claq_fiscal_alert}
      POSTGRES_USER: ${POSTGRES_USER:-claq_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claq_admin} -d ${POSTGRES_DB:-claq_fiscal_alert}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claq_internal

volumes:
  pgdata:
  certbot-etc:
  certbot-var:
