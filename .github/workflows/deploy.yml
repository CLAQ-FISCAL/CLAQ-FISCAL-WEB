name: deploy
on:
  push:
    branches: [main]
    paths:
      - 'backend/src/**'
      - 'backend/infra/**'
      - 'backend/config/**'
      - 'backend/prisma/**'
      - 'backend/scripts/**'
      - 'backend/package.json'
      - 'backend/cdk.json'
      - 'backend/cdk.context.json'
      - 'backend/tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: { inputs: { environment: { type: choice, required: true, options: [demo, prod] } } }
permissions: { id-token: write, contents: read }
concurrency:
  group: claq-backend-${{ inputs.environment || 'demo' }}
  cancel-in-progress: false
jobs:
  deploy:
    environment: ${{ inputs.environment || 'demo' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}, aws-region: ${{ vars.AWS_REGION }} }
      - run: npm run deploy:${{ inputs.environment || 'demo' }} --workspace=backend
