name: verify
on: [pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The repository is an npm workspace monorepo (frontend + backend): install once at the
      # root, then drive every check through the backend workspace.
      - run: npm ci
      - run: npm run db:generate --workspace=backend
      - run: npm run lint --workspace=backend
      - run: npm run build --workspace=backend
      - run: npm test --workspace=backend
      - run: npm run synth --workspace=backend -- --context env=demo